<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15245d" />
    <meta name="description" content="משחק חשבון אינסופי לתרגול חיבור וחיסור עד 100" />
    <meta name="game-version" content="100.6" />
    <title>חשבון עד 100 | משחק חיבור וחיסור</title>
    <link id="game-stylesheet" rel="stylesheet" />
    <script>
      document.querySelector("#game-stylesheet").href = `./styles.css?v=${Date.now()}`;
    </script>
  </head>
  <body>
    <main class="game-shell">
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>
      <section class="game-wrap" aria-label="משחק חשבון עד 100">
        <header class="topbar">
          <div class="brand">
            <span class="brand-icon" aria-hidden="true">🚀</span>
            <div><p>מסע בחלל המספרים</p><h1>חשבון עד 100</h1></div>
          </div>
          <div class="header-actions">
            <div class="score-chip" aria-label="ניקוד"><span class="star" aria-hidden="true">★</span><strong id="score">0</strong><small>נקודות</small></div>
            <button id="reset-button" class="reset-button" type="button" aria-label="התחלה מחדש" title="התחלה מחדש">↻</button>
          </div>
        </header>

        <div class="mode-picker" role="radiogroup" aria-label="בחירת סוג תרגילים">
          <button class="mode-option selected" type="button" data-mode="mixed" role="radio" aria-checked="true"><span aria-hidden="true">▦</span> הכול ביחד</button>
          <button class="mode-option" type="button" data-mode="addition" role="radio" aria-checked="false"><span aria-hidden="true">＋</span> רק חיבור</button>
          <button class="mode-option" type="button" data-mode="subtraction" role="radio" aria-checked="false"><span aria-hidden="true">−</span> רק חיסור</button>
        </div>

        <section class="question-card">
          <div class="mission-row">
            <div class="mission-label"><span id="question-number">שאלה 1</span><small>∞ אפשר להמשיך כמה שרוצים</small></div>
            <div class="stats-row"><div class="stat-pill">✦ רצף <span id="streak">0</span></div><div class="stat-pill stars-pill">★ <span id="stars">0</span></div></div>
          </div>

          <div class="milestone">
            <span id="milestone-label">עוד 10 תשובות לכוכב הבא</span>
            <div class="game-progress" role="progressbar" aria-label="התקדמות לכוכב הבא" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-bar"></div></div>
          </div>

          <div class="question-area">
            <button id="listen-button" class="listen-button" type="button" aria-label="הקראת התרגיל" title="הקראת התרגיל">
              <svg class="listen-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z" />
                <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z" />
                <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06" />
              </svg>
            </button>
            <p class="question-prompt">כמה זה?</p>
            <div class="equation" dir="ltr" id="equation" aria-live="polite">
              <span id="first-number">48</span><span class="operator" id="operator">+</span><span id="second-number">27</span><span class="equals">=</span><span class="answer-blank" id="answer-box">?</span>
            </div>
            <p id="speech-notice" class="speech-notice" role="status" hidden></p>
          </div>

          <div id="answers" class="answers" aria-label="אפשרויות תשובה"></div>
          <div class="feedback" aria-live="polite"><p id="feedback">בוחרים את התשובה הנכונה</p></div>
          <button id="next-button" class="next-button" type="button" hidden>לשאלה הבאה <span aria-hidden="true">←</span></button>

          <div class="number-line-wrap">
            <p id="number-line-help">אפשר להיעזר בקו המספרים</p>
            <div id="number-line" class="number-line" dir="ltr" aria-label="קו מספרים מאפס עד מאה"></div>
          </div>
        </section>
        <p class="parent-note">מתאים לתרגול חיבור וחיסור עד 100</p>
      </section>
    </main>
    <script>
      const gameScript = document.createElement("script");
      gameScript.src = `./script.js?v=${Date.now()}`;
      document.body.append(gameScript);
    </script>
  </body>
</html>
